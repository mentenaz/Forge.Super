# cargo-deny: run `cargo deny check` before a release (and in CI later).
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
version = 2
# Known vulnerabilities and unmaintained crates fail the check, wherever
# they are in the dependency tree. One that can't be fixed yet is listed
# below by advisory id with the reason, so each exception is a decision and
# a new one can't slip in unnoticed (design doc §13.11).
unmaintained = "all"
yanked = "warn"
ignore = [
    # Through Mentenaz.GPUI's dependencies; no maintained replacement in
    # those crates yet, so these follow upstream.
    { id = "RUSTSEC-2025-0141", reason = "bincode, via syntect: only loads syntax definitions bundled in the binary, never user input" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz, via resvg/usvg (SVG rendering); follows resvg upstream" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, via fontdb and gpui (fonts); follows upstream" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile, via Zed's reqwest fork; goes with that fork's next upstream sync" },
    # Linux accessibility (accesskit/atspi); not in Windows builds.
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, Linux accessibility only" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant, Linux accessibility only" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, Linux accessibility only" },
    # gpui-component's own use was replaced by pastey (Mentenaz.GPUI 7bbf750);
    # it remains through gpui's `image` (OpenEXR decoder: exr -> pulp) and
    # `metal` on Apple. Dropping the exr image format in gpui would remove it
    # from Windows builds.
    { id = "RUSTSEC-2024-0436", reason = "paste, via image's OpenEXR decoder and metal (Apple); compile-time macro only" },
]

[licenses]
version = 2
# Licences compatible with shipping Forge Super under GPL-3.0-or-later.
# The same list the Zed edition's licence tooling accepts.
allow = [
    "GPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "NCSA",
    "Unicode-3.0",
    "BSL-1.0",
    "OpenSSL",
    "bzip2-1.0.6",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate bloat the build; warn, don't fail (many come in
# through gpui and are fixed there, not here).
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version; that's fine.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Our own repositories, and the forks gpui depends on (source code on GitHub,
# not Zed's hosted services).
allow-git = ["https://github.com/gfx-rs/wgpu"]

[sources.allow-org]
github = ["mentenaz", "zed-industries"]
