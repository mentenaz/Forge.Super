[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/branding",
    "crates/shared/*",
    "crates/features/*/core",
    "crates/features/*/ui",
]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Mentenaz.GPUI, pinned to a commit. Bump all four together, in a commit of
# its own ("bump gpui to <sha>").
gpui = { git = "https://github.com/mentenaz/Mentenaz.GPUI.git", rev = "95337692374443feaff36561c9c3431b14663598" }
gpui-component = { git = "https://github.com/mentenaz/Mentenaz.GPUI.git", rev = "95337692374443feaff36561c9c3431b14663598" }
gpui-component-assets = { git = "https://github.com/mentenaz/Mentenaz.GPUI.git", rev = "95337692374443feaff36561c9c3431b14663598" }
gpui_platform = { git = "https://github.com/mentenaz/Mentenaz.GPUI.git", rev = "95337692374443feaff36561c9c3431b14663598" }

rust-embed = "8"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
# Zed's fork of notify, the same pin Mentenaz.GPUI uses, so there is one copy.
notify = { git = "https://github.com/zed-industries/notify", rev = "d842f16b2716bd60f09caf3ae3a894237ab38f54" }
tempfile = "3"
futures = "0.3"

branding = { path = "crates/branding" }
forge-host = { path = "crates/shared/host" }
forge-workspace = { path = "crates/shared/workspace" }

node-core = { path = "crates/features/node/core" }
node-ui = { path = "crates/features/node/ui" }
dotnet-core = { path = "crates/features/dotnet/core" }
dotnet-ui = { path = "crates/features/dotnet/ui" }
explorer-ui = { path = "crates/features/explorer/ui" }
git-ui = { path = "crates/features/git/ui" }
